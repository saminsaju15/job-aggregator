name: Daily Job Scraper

on:
  schedule:
    # 23:00 UTC is 7:00 PM EDT / 6:00 PM EST
    - cron: '0 23 * * *'
  workflow_dispatch: # Allows you to manually click a button in GitHub to run it anytime

permissions:
  contents: write

jobs:
  scrape-and-evaluate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run Job Scraper
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main_scraper.py
        
      - name: Commit and push database changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add job_tracker.db
          # This command checks if there are changes to job_tracker.db. If yes, it commits and pushes them.
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated update: Added new jobs to job_tracker.db" && git push)
